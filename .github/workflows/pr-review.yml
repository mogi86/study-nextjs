name: Claude PR Action

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  issue_comment:
    types: [created]

jobs:
  claude-pr:
    if: |
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Enable progress tracking
          track_progress: true

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          
          prompt: |
            このプルリクエストの差分を確認し、リグレッションテストのケースを作成して、プルリクエストにコメントしてください。
            作業は次の手順に沿って進めてください：
            1.  **変更内容を確認する:** `gh pr diff` コマンドを使って、コードの変更点や行番号を把握します。
            2. リグレッションテストケースを作成してください。
            3.  **リグレッションテストケースをマークダウンのリスト形式でプルリクエストのコメントを追加する:** `gh pr comment` コマンドを使って、コメントを追加してください。

            **リグレッションテストケースを作成する際の厳格なルール**

            * **絶対原則: 変更された行の内容のみをテストする**
            * **テキスト変更 → 表示確認のみ**
            * **設定変更 → 設定動作確認のみ**  
            * **コード変更 → その機能動作確認のみ**
            * **変更されていない機能は一切テストしない**
            * **関連機能や周辺機能のテストは不要**
            * **統合テスト、ビルドテスト、既存機能テストは作成禁止**
            * **1つの変更につき1つのテストケースのみ**
            * 必ずこのプルリクエストにコメントの形で作成してください。
            * 必ず日本語で作成してください。
            * **重要:** コメントの提出は必ず「COMMENT」タイプで行い、PR をブロックしないようにしてください。
