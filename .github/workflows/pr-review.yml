name: Claude PR Action

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-pr:
    if: |
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Enable progress tracking
          track_progress: true

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          
          prompt: |
            このプルリクエストの差分を確認し、リグレッションテストのケースを作成して、プルリクエストにコメントしてください。
            作業は次の手順に沿って進めてください：
            1.  **変更内容を確認する:** `gh pr diff` コマンドを使って、コードの変更点や行番号を把握します。
            2. リグレッションテストケースを作成してください。
            3.  *リグレッションテストケースをマークダウンのリスト形式でプルリクエストのコメントを追加する:** `gh pr comment` コマンドを使って、コメントを追加してください。

            **リグレッションテストケースを作成する際の厳格なルール**

            * あくまでリグレッションテストケースなので、新機能追加に対するテストケースの作成は不要です。
            * 差分がない機能については、絶対にテストケースの対象にしないください。
            * 過剰なテストケースの網羅は不要です。
            * 必ずこのプルリクエストにコメントの形で作成してください。
            * 必ず日本語で作成してください。
            * **重要:** コメントの提出は必ず「COMMENT」タイプで行い、PR をブロックしないようにしてください。
