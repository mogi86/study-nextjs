name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude Code Review
    
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Claude Code PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # プログレス表示を有効化
          track_progress: true
          
          prompt: |
            **必ず日本語で回答してください。英語での回答は禁止です。**
            
            このPull Requestのコードレビューを日本語で行ってください。
            
            レビュー項目：
            - コード品質（命名規則、可読性）
            - Next.jsベストプラクティス
            - TypeScript型安全性
            - セキュリティ問題
            - パフォーマンス改善点
            
            問題を発見した場合は、具体的な改善提案を日本語で記述してください。
            コメントは全て日本語で書いてください。

          # インラインコメントを有効化
          enable_inline_comments: true
          
          # レビュー対象ファイルのパターン
          include_patterns: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx
            **/*.json
            *.md
            
          # 除外パターン
          exclude_patterns: |
            node_modules/**
            .next/**
            dist/**
            build/**
            coverage/**
            *.min.js
            yarn.lock
            package-lock.json

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"